<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#EAE6DC"/>
  <!-- Desk surface -->
  <rect x="20" y="180" width="360" height="300" rx="4" fill="#D4CFC4"/>
  <!-- Notebook -->
  <rect x="60" y="200" width="220" height="280" rx="6" fill="#F4F1EA" stroke="#C8C3B8" stroke-width="1"/>
  <!-- Notebook lines -->
  <line x1="80" y1="240" x2="260" y2="240" stroke="#E0DDD5" stroke-width="1"/>
  <line x1="80" y1="260" x2="260" y2="260" stroke="#E0DDD5" stroke-width="1"/>
  <line x1="80" y1="280" x2="260" y2="280" stroke="#E0DDD5" stroke-width="1"/>
  <!-- Hand-drawn roadmap path on notebook -->
  <path d="M 110 220 C 110 300 190 300 190 380 C 190 440 110 440 110 460" fill="none" stroke="#0F6B5C" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- Waypoint circles -->
  <circle cx="110" cy="220" r="5" fill="#F4F1EA" stroke="#0F6B5C" stroke-width="1.5"/>
  <circle cx="190" cy="300" r="5" fill="#0F6B5C" stroke="#0F6B5C" stroke-width="1.5"/>
  <circle cx="110" cy="380" r="5" fill="#F4F1EA" stroke="#0F6B5C" stroke-width="1.5"/>
  <circle cx="110" cy="460" r="5" fill="#F4F1EA" stroke="#0F6B5C" stroke-width="1.5"/>
  <!-- Phase labels sketch -->
  <rect x="200" y="213" width="50" height="8" rx="2" fill="#D4CFC4"/>
  <rect x="200" y="225" width="35" height="6" rx="2" fill="#E0DDD5"/>
  <rect x="200" y="293" width="50" height="8" rx="2" fill="#D4CFC4"/>
  <rect x="200" y="373" width="50" height="8" rx="2" fill="#D4CFC4"/>
  <!-- Pencil -->
  <rect x="295" y="200" width="8" height="120" rx="2" fill="#E8C56A" transform="rotate(15 299 260)"/>
  <rect x="295" y="310" width="8" height="12" rx="1" fill="#C4965A" transform="rotate(15 299 316)"/>
  <!-- Laptop hint -->
  <rect x="60" y="100" width="200" height="130" rx="8" fill="#16202A" opacity="0.85"/>
  <rect x="68" y="108" width="184" height="114" rx="4" fill="#1E2F3F"/>
  <!-- Screen glow suggestion -->
  <rect x="80" y="118" width="160" height="8" rx="2" fill="#0F6B5C" opacity="0.4"/>
  <rect x="80" y="132" width="120" height="5" rx="2" fill="#4A7A6F" opacity="0.3"/>
  <rect x="80" y="143" width="140" height="5" rx="2" fill="#4A7A6F" opacity="0.3"/>
  <!-- Window light -->
  <rect x="300" y="0" width="100" height="180" fill="#F8F4E8" opacity="0.6"/>
  <line x1="300" y1="0" x2="300" y2="180" stroke="#EAE0CC" stroke-width="1"/>
</svg>
